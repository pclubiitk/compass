# 1. SHARED CREDENTIAL DEFINITIONS (Anchors)
# Environment variables used by Docker Compose containers (Postgres, RabbitMQ)

POSTGRES_USER: &pg_user "compass_dev"
POSTGRES_PASSWORD: &pg_pass "your_postgres_password_here"
POSTGRES_DB: &pg_db "compass"

RABBITMQ_USER: &rmq_user "compass"
RABBITMQ_PASS: &rmq_pass "your_rabbitmq_password_here"

# 2. APPLICATION CONFIGURATION (Aliases)
# Unmarshaled by the Go binary at runtime from /secret.yml

database:
  user: *pg_user
  password: *pg_pass
  name: *pg_db

rabbitmq:
  user: *rmq_user
  password: *rmq_pass

jwt:
  secret: "your_dev_jwt_secret_change_me"

smtp:
  user: "your_email@example.com"
  pass: "your_app_password"

openai:
  moderation: "sk-proj-YOUR_DEV_OPENAI_KEY"

recaptcha:
  key: "YOUR_RECAPTCHA_SITE_KEY"

oa:
  url: "https://oag.iitk.ac.in/digital-studverify/checkstudent"
  key: "YOUR_OA_KEY"

automation:
  url: "http://host.docker.internal:8090"
  key: "YOUR_AUTOMATION_KEY"

profile:
  site_url: "https://oa.cc.iitk.ac.in/Oa/Jsp/Photo/%s_0.jpg"
  home_url: "https://home.iitk.ac.in/~%s/dp"