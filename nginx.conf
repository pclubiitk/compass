# Define a custom PID file to avoid conflicts
# pid /home/this_is_mjk/compass/nginx.pid;

# The events block is mandatory
events {
    worker_connections 768;
}

# Wrap ALL your server blocks in this single http block
http {
    
    # FIXME(prod): Change to correct path. 
    access_log /Users/Shared/Deploy/codebase/compass-assets/logs/access.log;
    error_log /Users/Shared/Deploy/codebase/compass-assets/logs/error.log;


    # Shared proxy settings to keep it clean
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 443 ssl;
        server_name search.pclub.in; # Routes search.pclub.in

        # FIXME(prod): Change to correct path. 
        ssl_certificate /Users/Shared/Deploy/codebase/compass-assets/certs/cert.pem;
        ssl_certificate_key /Users/Shared/Deploy/codebase/compass-assets/certs/key.pem;


        # Location for the main (compass) frontend, opens up profile page at root.
        location / {
            # 3001 Port for Compass Frontend
            proxy_pass http://localhost:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Location for the main frontend (e.g., Next.js, React)
        location /students/ {
            # 3000 Port for Search Frontend
            proxy_pass http://localhost:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route all requests to the auth service
        location /auth/api/ {
            proxy_pass http://localhost:8080/api/; # Port for Auth Service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Location for the API server of map.
        # /api/... -> http://localhost:8081/...
        location /api/ {
            proxy_pass http://localhost:8081/api/; # Port for Compass API
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # WebSocket Support
            # proxy_set_header Upgrade $http_upgrade;
            # proxy_set_header Connection "upgrade";
        }

        location /assets/ {
            proxy_pass http://localhost:8082/; # Port for Asset Service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Location for the API server of student search
        # /students/api/... -> http://localhost:8083/...
        location /students/api/ {
            proxy_pass http://localhost:8083/api/; # Port for Search API
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

    }

    # This server block catches all HTTP (port 80) requests
    # and forwards them to the HTTPS version.
    server {
        listen 80 default_server;
        server_name _; # Catches all hostnames
        return 301 https://$host$request_uri;
    }
}